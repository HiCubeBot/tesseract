[project]
name = "tesseract"
version = "0.1.0"
description = "Tesseract Controller – Caddy-Verwaltung mit mTLS und Coraza WAF"
readme = "README.md"
authors = [
    { name = "c.riehe", email = "git@criehe.de" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.2",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tesseract = "tesseract:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
