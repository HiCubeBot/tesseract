[project]
name = "tesseract"
version = "1.19.0"
description = "Tesseract Controller – Caddy-Verwaltung mit mTLS und Coraza WAF"
readme = "README.md"
authors = [
    { name = "c.riehe", email = "git@criehe.de" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "ldap3>=2.9.1",
    "maxminddb>=3.3.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "segno>=1.6.6",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[project.scripts]
tesseract = "tesseract:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
