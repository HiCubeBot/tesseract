# Vorlage für einen weiteren Node: Caddy + Tesseract-Agent.
#
# 1. Im Controller unter Nodes „Node hinzufügen“ → Beitritts-Token (30 Min., einmalig)
# 2. .env neben dieser Datei:
#      TESSERACT_CONTROLLER=https://tesseract.beispiel.de
#      TESSERACT_JOIN_TOKEN=<Token>
# 3. docker compose up -d   →   docker compose logs agent zeigt den Schlüssel-Fingerabdruck
# 4. Im Controller vergleichen und bestätigen. Das Token wird danach nicht mehr gebraucht.
#
# Der Node braucht nur ausgehend HTTPS zum Controller – kein offener Admin-Port, kein VPN.
name: tesseract-node

services:
  caddy:
    image: ghcr.io/hicubebot/tesseract-caddy:${TESSERACT_VERSION:-latest}
    restart: unless-stopped
    # Erster Start ohne Config: nur die Admin-API im internen Netz. Danach lädt der Agent
    # die Config des Controllers; --resume startet nach einem Neustart mit dem letzten Stand.
    command:
      - sh
      - -c
      - >-
        printf '{"admin":{"listen":"0.0.0.0:2019"}}' > /tmp/start.json &&
        caddy run --config /tmp/start.json --resume
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Port 2019 (Admin-API) wird absichtlich nicht veröffentlicht.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/tesseract
    networks: [node]

  agent:
    image: ghcr.io/hicubebot/tesseract-agent:${TESSERACT_VERSION:-latest}
    restart: unless-stopped
    depends_on: [caddy]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TESSERACT_AGENT_CONTROLLER: ${TESSERACT_CONTROLLER:?Adresse des Controllers fehlt}
      TESSERACT_AGENT_JOIN_TOKEN: ${TESSERACT_JOIN_TOKEN:-}
      TESSERACT_AGENT_CADDY_ADMIN_URL: http://caddy:2019
      # WAF-Treffer für die Auto-Sperre (Pfad muss zu TESSERACT_CADDY_WAF_LOG des Controllers passen)
      TESSERACT_AGENT_WAF_LOG: /var/log/tesseract/waf.log
      # Zugriffs-Log für Logs und Statistik (Pfad wie TESSERACT_CADDY_ACCESS_LOG des Controllers)
      TESSERACT_AGENT_ACCESS_LOG: /var/log/tesseract/access.log
      # Nur nötig, wenn das Zertifikat des Controllers nicht öffentlich vertraut ist:
      # TESSERACT_AGENT_CONTROLLER_CA: /data/controller-ca.pem
    volumes:
      - agent-data:/data
      - caddy-logs:/var/log/tesseract:ro
    networks: [node]

  # Optional: Bot-Schutz mit Anubis (Proof-of-Work vor öffentlichen Hosts, gegen KI-Crawler).
  # Starten mit: docker compose --profile anubis up -d
  # dann im Controller unter Einstellungen › Integrationen die Anubis-Adresse eintragen
  # (gilt für alle Nodes, z. B. http://anubis:8923). Ein Anubis prüft alle Hosts dieses Nodes.
  anubis:
    image: ghcr.io/techarohq/anubis:${ANUBIS_VERSION:-v1.28.2}
    profiles: [anubis]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BIND: ":8923"
      # Subrequest-Modus: Caddy fragt nur an (forward_auth), Anubis leitet nichts weiter
      TARGET: " "
      POLICY_FNAME: /policy.yaml
      # Cookie gilt für den jeweiligen Host – ein Anubis für viele Domains
      COOKIE_DYNAMIC_DOMAIN: "true"
      DIFFICULTY: ${ANUBIS_DIFFICULTY:-4}
      # Fester Schlüssel (64 Hex-Zeichen), damit bestandene Prüfungen einen Neustart überleben:
      # openssl rand -hex 32
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_KEY:-}
    configs:
      - source: anubis-policy
        target: /policy.yaml
    networks: [node]

networks:
  node:

configs:
  # Bot-Schutz: Standard-Policy von Anubis v1.28.2, aber DENY mit 403 – Caddy fragt Anubis per
  # forward_auth, und dabei hieße 2xx „durchlassen“ (Anubis antwortet sonst mit 200).
  anubis-policy:
    content: |
      bots:
        -
          import: (data)/bots/_deny-pathological.yaml
        - import: (data)/bots/aggressive-brazilian-scrapers.yaml
        - import: (data)/common/domain-fronting.yaml
        - import: (data)/meta/ai-block-aggressive.yaml
        - import: (data)/crawlers/_allow-good.yaml
        - import: (data)/clients/x-firefox-ai.yaml
        - import: (data)/crawlers/xai.yaml
        - import: (data)/common/keep-internet-working.yaml
        - name: countries-with-aggressive-scrapers
          action: WEIGH
          geoip:
            countries:
              - BR
              - CN
          weight:
            adjust: 10
        - name: aggressive-asns-without-functional-abuse-contact
          action: WEIGH
          asns:
            match:
              - 13335
              - 136907
              - 45102
          weight:
            adjust: 10
        - name: generic-browser
          user_agent_regex: >-
            Mozilla|Opera
          action: WEIGH
          weight:
            adjust: 10
      dnsbl: false
      honeypot:
        enabled: true
        implementation: naive
      openGraph:
        enabled: false
        considerHost: false
        ttl: 24h
      status_codes:
        CHALLENGE: 200
        DENY: 403
      store:
        backend: memory
        parameters: {}
      thresholds:
        - name: minimal-suspicion
          expression: weight <= 0
          action: ALLOW
        - name: mild-suspicion
          expression:
            all:
              - weight > 0
              - weight < 10
          action: CHALLENGE
          challenge:
            algorithm: metarefresh
            difficulty: 1
        - name: moderate-suspicion
          expression:
            all:
              - weight >= 10
              - weight < 20
          action: CHALLENGE
          challenge:
            algorithm: fast
            difficulty: 2
        - name: mild-proof-of-work
          expression:
            all:
              - weight >= 20
              - weight < 30
          action: CHALLENGE
          challenge:
            algorithm: fast
            difficulty: 4
        - name: extreme-suspicion
          expression: weight >= 30
          action: CHALLENGE
          challenge:
            algorithm: fast
            difficulty: 6

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  agent-data:
