# Prüfungen bei jedem Push und Pull Request (wie „Vor jedem PR“ in CLAUDE.md)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Abhängigkeiten auf Schwachstellen prüfen
        run: |
          uv export --no-dev --no-emit-project --no-hashes --format requirements-txt > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --disable-pip --no-deps

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Abhängigkeiten auf Schwachstellen prüfen
        run: |
          uv export --no-dev --no-emit-project --no-hashes --format requirements-txt > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --disable-pip --no-deps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev

  images:
    # Images bauen (nicht veröffentlichen) – fängt kaputte Dockerfiles früh ab
    runs-on: ubuntu-latest
    needs: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: agent
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: docker/caddy
          push: false
