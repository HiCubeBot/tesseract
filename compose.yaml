name: tesseract

services:
  tesseract:
    build: .
    image: tesseract:dev
    restart: unless-stopped
    environment:
      TESSERACT_CADDY_ADMIN_URL: http://caddy:2019
      TESSERACT_LOG_LEVEL: ${TESSERACT_LOG_LEVEL:-info}
    volumes:
      - tesseract-data:/data
    networks: [internal]

  caddy:
    build: ./docker/caddy
    image: tesseract-caddy:dev
    restart: unless-stopped
    depends_on: [tesseract]
    environment:
      TESSERACT_DOMAIN: ${TESSERACT_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Port 2019 (Admin-API) wird absichtlich nicht veröffentlicht.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:

volumes:
  tesseract-data:
  caddy-data:
  caddy-config:
