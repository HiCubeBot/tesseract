name: tesseract

services:
  tesseract:
    build: .
    # Veröffentlichtes Image (docker compose pull) – oder lokal bauen: docker compose up -d --build
    image: ghcr.io/hicubebot/tesseract:${TESSERACT_VERSION:-latest}
    restart: unless-stopped
    # Alle TESSERACT_*-Einstellungen aus der .env (Vorlage: .env.example).
    # Die Werte unter environment: gehören zum Stack und haben Vorrang.
    env_file:
      - path: .env
        required: false
    # Härtung: Dateisystem nur lesbar (Daten liegen im Volume), keine neuen Rechte, keine
    # Linux-Capabilities – der Controller lauscht auf 8000 und braucht keine.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TESSERACT_CADDY_ADMIN_URL: http://caddy:2019
      TESSERACT_CONTROLLER_DOMAIN: ${TESSERACT_DOMAIN:-localhost}
      TESSERACT_LOG_LEVEL: ${TESSERACT_LOG_LEVEL:-info}
      # WAF-Treffer für die Auto-Sperre: Caddy schreibt, der Controller liest
      TESSERACT_CADDY_WAF_LOG: /var/log/tesseract/waf.log
      TESSERACT_WAF_LOG_PATH: /var/log/tesseract/waf.log
      # Zugriffs-Log für die zentrale Log-Ansicht und Statistik
      TESSERACT_CADDY_ACCESS_LOG: /var/log/tesseract/access.log
      TESSERACT_ACCESS_LOG_PATH: /var/log/tesseract/access.log
    volumes:
      - tesseract-data:/data
      - caddy-logs:/var/log/tesseract:ro
    networks: [internal]

  caddy:
    build: ./docker/caddy
    image: ghcr.io/hicubebot/tesseract-caddy:${TESSERACT_VERSION:-latest}
    restart: unless-stopped
    depends_on: [tesseract]
    # Startet mit --resume: nach einem Neustart gilt die zuletzt vom Controller geladene
    # Config (liegt in /config); nur beim allerersten Start gilt die Caddyfile
    # (mit TESSERACT_CLOUDFLARE_TOKEN die Variante mit DNS-01).
    command: tesseract-caddy
    # Härtung: nur das Recht, Ports unter 1024 zu öffnen
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TESSERACT_DOMAIN: ${TESSERACT_DOMAIN:-localhost}
      TESSERACT_CLOUDFLARE_TOKEN: ${TESSERACT_CLOUDFLARE_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Port 2019 (Admin-API) wird absichtlich nicht veröffentlicht.
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/tesseract
    networks: [internal]

  # Optional: Loki als zusätzlicher Log-Speicher (lange Aufbewahrung, Auswertung in Grafana).
  # Starten mit: docker compose --profile loki up -d
  # und in der .env: TESSERACT_LOKI_URL=http://loki:3100
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.4.2}
    profiles: [loki]
    restart: unless-stopped
    command: -config.file=/etc/loki/tesseract.yaml -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-2160h}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Port 3100 nur bei Bedarf veröffentlichen (z. B. für ein Grafana außerhalb des Stacks):
    # ports:
    #   - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/tesseract.yaml:ro
      - loki-data:/loki
    networks: [internal]

  # Optional: VictoriaLogs statt Loki – braucht weniger Speicher und RAM.
  # Starten mit: docker compose --profile victorialogs up -d
  # und in der .env: TESSERACT_LOKI_URL=http://victorialogs:9428 und TESSERACT_LOKI_KIND=victorialogs
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_VERSION:-v1.53.0}
    profiles: [victorialogs]
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=${VICTORIALOGS_RETENTION:-90d}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Port 9428 (Abfrage und Web-Oberfläche /select/vmui) nur bei Bedarf veröffentlichen:
    # ports:
    #   - "127.0.0.1:9428:9428"
    volumes:
      - victorialogs-data:/vlogs
    networks: [internal]

  # Optional: Hosts aus Docker-Labels. Socket-Proxy mit Nur-Lese-Rechten auf die Container-Liste –
  # der Controller bekommt so nie den vollen Docker-Socket.
  # Starten mit: docker compose --profile docker up -d
  # und in der .env: TESSERACT_DOCKER_HOST=tcp://docker-proxy:2375
  docker-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_PROXY_VERSION:-0.3.0}
    profiles: [docker]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  # Optional: Bot-Schutz mit Anubis (Proof-of-Work vor öffentlichen Hosts, gegen KI-Crawler).
  # Starten mit: docker compose --profile anubis up -d
  # dann unter Einstellungen › Integrationen „http://anubis:8923“ eintragen und je Host
  # unter Sicherheit einschalten. Ein Anubis prüft für alle Hosts dieses Nodes.
  anubis:
    image: ghcr.io/techarohq/anubis:${ANUBIS_VERSION:-v1.28.2}
    profiles: [anubis]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BIND: ":8923"
      # Subrequest-Modus: Caddy fragt nur an (forward_auth), Anubis leitet nichts weiter
      TARGET: " "
      POLICY_FNAME: /policy.yaml
      # Cookie gilt für den jeweiligen Host – ein Anubis für viele Domains
      COOKIE_DYNAMIC_DOMAIN: "true"
      DIFFICULTY: ${ANUBIS_DIFFICULTY:-4}
      # Fester Schlüssel (64 Hex-Zeichen), damit bestandene Prüfungen einen Neustart überleben:
      # openssl rand -hex 32
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_KEY:-}
    configs:
      - source: anubis-policy
        target: /policy.yaml
    networks: [internal]

networks:
  internal:

configs:
  # Bot-Schutz: Standard-Policy von Anubis v1.28.2, aber DENY mit 403 – Caddy fragt Anubis per
  # forward_auth, und dabei hieße 2xx „durchlassen“ (Anubis antwortet sonst mit 200).
  anubis-policy:
    content: |
      bots:
        -
          import: (data)/bots/_deny-pathological.yaml
        - import: (data)/bots/aggressive-brazilian-scrapers.yaml
        - import: (data)/common/domain-fronting.yaml
        - import: (data)/meta/ai-block-aggressive.yaml
        - import: (data)/crawlers/_allow-good.yaml
        - import: (data)/clients/x-firefox-ai.yaml
        - import: (data)/crawlers/xai.yaml
        - import: (data)/common/keep-internet-working.yaml
        - name: countries-with-aggressive-scrapers
          action: WEIGH
          geoip:
            countries:
              - BR
              - CN
          weight:
            adjust: 10
        - name: aggressive-asns-without-functional-abuse-contact
          action: WEIGH
          asns:
            match:
              - 13335
              - 136907
              - 45102
          weight:
            adjust: 10
        - name: generic-browser
          user_agent_regex: >-
            Mozilla|Opera
          action: WEIGH
          weight:
            adjust: 10
      dnsbl: false
      honeypot:
        enabled: true
        implementation: naive
      openGraph:
        enabled: false
        considerHost: false
        ttl: 24h
      status_codes:
        CHALLENGE: 200
        DENY: 403
      store:
        backend: memory
        parameters: {}
      thresholds:
        - name: minimal-suspicion
          expression: weight <= 0
          action: ALLOW
        - name: mild-suspicion
          expression:
            all:
              - weight > 0
              - weight < 10
          action: CHALLENGE
          challenge:
            algorithm: metarefresh
            difficulty: 1
        - name: moderate-suspicion
          expression:
            all:
              - weight >= 10
              - weight < 20
          action: CHALLENGE
          challenge:
            algorithm: fast
            difficulty: 2
        - name: mild-proof-of-work
          expression:
            all:
              - weight >= 20
              - weight < 30
          action: CHALLENGE
          challenge:
            algorithm: fast
            difficulty: 4
        - name: extreme-suspicion
          expression: weight >= 30
          action: CHALLENGE
          challenge:
            algorithm: fast
            difficulty: 6

volumes:
  tesseract-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  loki-data:
  victorialogs-data:
